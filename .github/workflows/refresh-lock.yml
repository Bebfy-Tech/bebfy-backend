name: Refresh lockfile for ChatGPT refactor
on:
  push:
    branches: [refactor/codigo-chatgpt]
    paths:
      - '.github/workflows/refresh-lock.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/codigo-chatgpt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate consistent package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile to refactor branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate consistent lockfile"
            git push origin HEAD:refactor/codigo-chatgpt
          fi
