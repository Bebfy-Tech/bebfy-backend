name: Generate schema drift migration for ChatGPT refactor
on:
  push:
    branches: [refactor/codigo-chatgpt]
    paths:
      - '.github/workflows/refresh-schema.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bebfy_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: bebfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bebfy_test -d bebfy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bebfy_test:test-only-password@localhost:5432/bebfy_test?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/codigo-chatgpt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply existing baseline migrations
        run: npx prisma migrate deploy
      - name: Generate schema alignment migration from actual baseline database
        run: |
          mkdir -p prisma/migrations/20261109140000_schema_alignment
          npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ./prisma/schema.prisma --script > prisma/migrations/20261109140000_schema_alignment/migration.sql
          test -s prisma/migrations/20261109140000_schema_alignment/migration.sql
      - name: Commit schema alignment migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261109140000_schema_alignment/migration.sql
          git commit -m "db: align legacy baseline migrations with current Prisma schema"
          git push origin HEAD:refactor/codigo-chatgpt
