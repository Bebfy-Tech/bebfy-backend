name: Bebfy Dependency Security Audit

on:
  push:
    branches: [refactor/codigo-chatgpt]
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact locked dependencies
        run: npm ci
      - name: Classify production and development advisories
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node - <<'NODE'
          const fs=require('fs');
          for (const [scope,file] of [['all','/tmp/audit-all.json'],['production','/tmp/audit-prod.json']]) {
            const raw=JSON.parse(fs.readFileSync(file,'utf8'));
            const issues=Object.entries(raw.vulnerabilities||{}).map(([name,v])=>({
              name,severity:v.severity,direct:v.isDirect,
              fix:v.fixAvailable===true?'available':v.fixAvailable===false?'none':v.fixAvailable,
              causes:(v.via||[]).filter(x=>typeof x==='object').map(x=>({
                title:x.title,range:x.range,url:x.url,
              })).slice(0,3),
            }));
            console.log('DEPENDENCY_AUDIT_'+scope.toUpperCase(),JSON.stringify({
              summary:raw.metadata?.vulnerabilities||{},packages:issues,
            },null,2));
          }
          NODE
