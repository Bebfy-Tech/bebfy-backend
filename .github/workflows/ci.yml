name: Bebfy Backend CI

on:
  push:
    branches: [main, refactor/backend-stabilization, refactor/codigo-chatgpt]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: E2E tests
        env:
          JWT_SECRET: ci-test-only-not-a-production-secret-at-least-32-characters
        run: npm run test:e2e
